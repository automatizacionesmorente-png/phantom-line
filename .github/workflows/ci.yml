name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - run: npm ci
      - run: npm run lint
      # PageProps and LayoutProps are global types that Next.js generates; tsc needs them first.
      - run: npx next typegen
      - run: npx tsc --noEmit
      # Unit, property-based and PGlite database tests. No secrets: the suite never calls Gemini or Neon.
      - run: npx vitest run
      # Production build plus the client-bundle check (no server secret may reach the browser).
      - run: npm run build
